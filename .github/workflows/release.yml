name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re-)release, e.g. v0.1.0"
        required: true

env:
  RUST_VERSION: "1.100"
  BUN_VERSION:  "1.2.20"
  CARGO_TERM_COLOR: always

# tarball naming: <tool>-<os>-<arch>.tar.gz, where (os, arch) is one of:
#   linux-amd64, linux-arm64, darwin-amd64, darwin-arm64, windows-amd64 (the names
#   `dpe install` uses), and its layout comes from scripts/stage-tarball.sh.
# The catalog's url_template substitutes {name}/{os}/{arch}/{version} so
# this naming MUST stay aligned with scripts/build-catalog.sh's PLATFORMS.

jobs:
  # ─── Per-platform Rust build ───────────────────────────────────────────
  build-rust:
    name: build-rust (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner:   ubuntu-latest
            target:   x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner:   ubuntu-latest
            target:   aarch64-unknown-linux-gnu
          - platform: darwin-amd64
            runner:   macos-latest
            target:   x86_64-apple-darwin
          - platform: darwin-arm64
            runner:   macos-latest
            target:   aarch64-apple-darwin
          - platform: windows-amd64
            runner:   windows-latest
            target:   x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets:   ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross compiler (linux-arm64 only)
        if: matrix.platform == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          mkdir -p .cargo
          {
            echo '[target.aarch64-unknown-linux-gnu]'
            echo 'linker = "aarch64-linux-gnu-gcc"'
          } >> .cargo/config.toml

      - name: Fetch pdfium (doc-converter)
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
              linux-amd64)   plat=linux-x64 ;;
              darwin-amd64)  plat=mac-x64 ;;
              darwin-arm64)  plat=mac-arm64 ;;
              windows-amd64) plat=win-x64 ;;
              *)             plat="${{ matrix.platform }}" ;;
          esac
          bash tools/doc-converter/scripts/fetch-pdfium.sh "$plat"

      - name: cargo build --release --target ${{ matrix.target }}
        run: cargo build --workspace --release --target ${{ matrix.target }}

      # Per-tool tarballs. Deterministic flags so catalog sha256s reproduce
      # bit-for-bit:
      #   --sort=name        — stable file order
      #   --mtime='@1700000000' — fixed epoch (arbitrary anchor)
      #   --owner=0 --group=0 --numeric-owner — strip uid/gid metadata
      #   --use-compress-program='gzip -n' — disable gzip's own timestamp
      - name: Build tarballs
        shell: bash
        run: |
          for tool_dir in tools/*/; do
              [ -f "$tool_dir/Cargo.toml" ] || continue   # TS tools: build-ts job
              bash scripts/stage-tarball.sh "$tool_dir" "${{ matrix.platform }}" stage \
                  "target/${{ matrix.target }}/release"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: rust-${{ matrix.platform }}
          path: stage/*

  # ─── TS tool tarballs (one tarball per TS tool, platform-independent) ──
  build-ts:
    name: build-ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build per-tool TS bundles
        shell: bash
        run: |
          for tool_dir in tools/*/; do
              tool=$(basename "$tool_dir")
              [ -f "$tool_dir/package.json" ] || continue
              ( cd "$tool_dir"
                bun install --frozen-lockfile
                # Bundle main.ts to dist/<tool>.js (or src as-is if no build script).
                if jq -e '.scripts.build' package.json >/dev/null 2>&1; then
                    bun run build
                fi
              )
              # Platform-independent: pack once, copy under every platform name.
              bash scripts/stage-tarball.sh "$tool_dir" linux-amd64 stage
              for plat in linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
                  cp "stage/${tool}-linux-amd64.tar.gz" "stage/${tool}-${plat}.tar.gz"
              done
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ts-bundles
          path: stage/*

  # ─── Build catalog.json + finalize GH Release ──────────────────────────
  release:
    name: release
    needs: [build-rust, build-ts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Determine tag/version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              tag="${{ github.event.inputs.tag }}"
          else
              tag="${{ github.ref_name }}"
          fi
          [[ "$tag" =~ ^v(.+)$ ]] || { echo "tag $tag must start with v"; exit 1; }
          version="${BASH_REMATCH[1]}"
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # CRITICAL: actions/upload-artifact ZIPs internally and STRIPS unix
      # exec bits. Re-apply chmod after download-artifact in EVERY consumer.
      - name: Stage tarballs + chmod
        shell: bash
        run: |
          mkdir -p tarballs
          find artifacts -type f -name '*.tar.gz' -exec cp {} tarballs/ \;
          chmod 0644 tarballs/*.tar.gz

      - name: Generate catalog.json
        shell: bash
        run: |
          chmod +x scripts/build-catalog.sh
          scripts/build-catalog.sh \
            --tarball-dir tarballs \
            --version "${{ steps.ver.outputs.version }}" \
            --output  catalog.json
          echo "--- catalog.json ---"
          cat catalog.json

      - name: Stage release files
        shell: bash
        run: |
          mkdir -p release-staged
          cp tarballs/*.tar.gz   release-staged/
          cp catalog.json        release-staged/

      # Orphan draft releases accumulate when finalize fails on a prior run.
      # softprops/action-gh-release v3 cannot finalize when one exists for
      # the same tag. `gh release delete <tag>` can't disambiguate multiple
      # drafts; use the raw REST API which exposes numeric id.
      # NOTE: do NOT use `gh release list --json databaseId` - that field
      # is invalid for releases (only for issues/PRs). Use `gh api` directly.
      - name: Clean up orphan draft releases for this tag
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh api "/repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id" \
            | while read -r id; do
                [ -n "$id" ] || continue
                echo "deleting orphan draft release id=$id"
                gh api -X DELETE "/repos/$GITHUB_REPOSITORY/releases/$id" || true
              done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name:   ${{ steps.ver.outputs.tag }}
          files:      release-staged/*
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
          generate_release_notes: true
