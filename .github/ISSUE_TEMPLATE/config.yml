    url: https://github.com/combycode/dpe-tools/discussions
    about: Questions and "how do I do X" go in Discussions, not Issues. Faster answers, better discoverability.
  - name: Security vulnerability
    url: https://github.com/combycode/dpe-tools/security/advisories/new
    about: Do NOT file public issues for security issues. Use a private advisory or email security@combycode.com.
  - name: Issues with the dpe runner / framework / standard tools
    url: https://github.com/combycode/dpe/issues
    about: This repo only ships custom tools. Issues with the runner, frameworks, or the 7 standard tools belong in the dpe repo.
