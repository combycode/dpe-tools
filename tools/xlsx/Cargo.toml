[package]
name        = "combycode-dpe-tool-xlsx"
version     = "0.1.0"
edition     = "2021"
description = "DPE tool: XLSX file parser and row extractor."
license     = "AGPL-3.0-or-later"
repository  = "https://github.com/combycode/dpe-tools"
homepage    = "https://github.com/combycode/dpe-tools"
readme      = "README.md"

[[bin]]
name = "xlsx"
path = "src/main.rs"

[dependencies]
combycode-dpe = "2"
quick-xml     = "0.42"
zip           = "9"
serde         = { version = "1", features = ["derive"] }
# preserve_order: emitted JSON keeps input key order (was implied by bson 2 until bson 3).
serde_json    = { version = "1", features = ["preserve_order"] }
regex         = "1"
chrono        = "0.4"

[lints]
workspace = true
