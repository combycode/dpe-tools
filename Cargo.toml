[workspace]
resolver = "2"
members = [
    "tools/doc-converter",
    "tools/mongo-find",
    "tools/mongo-upsert",
    "tools/read-tables",
    "tools/validate",
    "tools/xlsx",
]

[workspace.package]
edition      = "2021"
rust-version = "1.91"
license      = "AGPL-3.0-or-later"
repository   = "https://github.com/combycode/dpe-tools"
homepage     = "https://github.com/combycode/dpe-tools"

[workspace.lints.rust]
unused           = { level = "deny", priority = -1 }
dead_code        = "deny"
unreachable_code = "deny"
unreachable_pub  = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all          = { level = "deny", priority = -1 }
correctness  = { level = "deny", priority = -1 }
suspicious   = { level = "deny", priority = -1 }
# keep pedantic/perf opt-in per-crate; deny the high-signal groups above.

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
panic         = "abort"
